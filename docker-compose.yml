services:
  postgres:
    image: postgres:16-alpine
    container_name: imperiorp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imperio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-imperiorp_staff}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # El puerto no se publica: sólo la aplicación necesita llegar a la base.
    # Descomentá para conectarte con un cliente desde tu máquina.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imperio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: imperiorp_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-imperio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-imperiorp_staff}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?generá uno con: openssl rand -base64 48}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-owner}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  postgres_data:
